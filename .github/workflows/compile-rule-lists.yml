name: Recompile blocklist and allowlist from sources

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Needed to push commits back to the repo

jobs:
  recompile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Upstream Source Changes
        id: check_sources
        run: node check-sources.js

      - name: Download OISD Big List
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          curl -L https://big.oisd.nl/ -o ../oisd.txt

      - name: Compile Blocklist
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          npx @adguard/hostlist-compiler -v -c hostlist-compiler-config.json -o blocklist

      - name: Post-process Blocklist
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          # Capture whitelisted entries to allowlist
          grep '^@@' blocklist > allowlist || true
          # Remove all whitelisted entries
          sed -i '/^@@/d' blocklist
          # Remove empty lines
          sed -i '/^$/d' blocklist

      - name: Verify Rule Changes
        if: steps.check_sources.outputs.changed == 'true'
        id: check_rules
        run: |
          if git diff --quiet blocklist allowlist; then
            echo "No actual rule changes detected in the compiled output."
            echo "rules_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Actual rule changes detected."
            echo "rules_changed=true" >> $GITHUB_OUTPUT
            # Update the README statistics
            node update-readme.js
            # Save the new upstream headers/hashes to the lockfile
            node check-sources.js --update
          fi

      - name: Commit and Push Changes
        if: steps.check_sources.outputs.changed == 'true' && steps.check_rules.outputs.rules_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist allowlist README.md sources-lock.json
          currentDate=$(date '+%Y-%m-%d')
          currentTime=$(date '+%H:%M:%S')
          git commit -m "Auto-regenerated blocklist, allowlist, and stats ${currentDate} ${currentTime}"
          git pull --rebase -X ours origin master
          git push
