name: Recompile blocklist and allowlist from sources

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Needed to push commits back to the repo

jobs:
  recompile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm' # Enables npm dependency caching

      - name: Install Dependencies
        run: npm ci

      - name: Check Upstream Source Changes
        id: check_sources
        run: node check-sources.js

      - name: Download OISD Big List
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          curl -L https://big.oisd.nl/ -o ../oisd.txt

      - name: Compile Blocklist
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          npm run compile

      - name: Post-process Blocklist
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          # Capture whitelisted entries to allowlist
          grep '^@@' blocklist > allowlist || true
          # Remove all whitelisted entries
          sed -i '/^@@/d' blocklist
          # Remove empty lines
          sed -i '/^$/d' blocklist

      - name: Verify and Update Lockfile
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          # Always update the lockfile so that we don't recompile on subsequent runs
          node check-sources.js --update

          # Check if the blocklist or allowlist rules have actual changes
          if git diff --quiet blocklist allowlist; then
            echo "No actual rule changes detected in the compiled output. Skipping README timestamp update."
          else
            echo "Actual rule changes detected. Updating README statistics..."
            node update-readme.js
          fi

      - name: Commit and Push Changes
        if: steps.check_sources.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist allowlist README.md sources-lock.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            currentDate=$(date '+%Y-%m-%d')
            currentTime=$(date '+%H:%M:%S')
            git commit -m "Auto-regenerated blocklist, allowlist, and stats ${currentDate} ${currentTime}"
            git pull --rebase -X ours origin master
            git push
          fi
